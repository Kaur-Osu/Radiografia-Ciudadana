server {
    listen 80;
    server_name radiografiaciudadana.utportfolio.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/radiografia-ciudadana-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://radiografiaciudadana.utportfolio.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name radiografiaciudadana.utportfolio.cloud;

    ssl_certificate /etc/letsencrypt/live/radiografiaciudadana.utportfolio.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radiografiaciudadana.utportfolio.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
